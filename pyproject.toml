[project]
name = "yggdrasil"
version = "0.1.0"
description = "A library for finite element analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Jan Marthedal Rasmussen" }]
dependencies = [
    "numpy>=2.4.2",
    "scipy>=1.17.0",
]

[project.urls]
Repository = "https://github.com/janmarthedal/yggdrasil"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
meshio = ["meshio"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.1",
    "ty>=0.0.21",
]
examples = [
    "matplotlib>=3.10",
    "meshio",
]
