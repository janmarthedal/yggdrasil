<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tet4 Shape Functions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; }
  #container { display: flex; flex-direction: column; height: 100vh; }
  #controls {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: #16213e; border-bottom: 1px solid #334;
  }
  #controls label { font-size: 14px; }
  #controls button {
    padding: 6px 16px; border: 1px solid #556;
    background: transparent; color: #e0e0e0; border-radius: 4px;
    cursor: pointer; font-size: 14px; transition: background 0.15s;
  }
  #controls button.active { background: #0f3460; border-color: #4a8; }
  #controls button:hover { background: #0f3460; }
  #info {
    position: absolute; bottom: 16px; left: 16px;
    font-size: 13px; color: #888; pointer-events: none;
  }
  canvas { display: block; flex: 1; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #colorbar {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 200px; border: 1px solid #556; pointer-events: none;
  }
  #cb-max, #cb-min {
    position: absolute; right: 48px; font-size: 12px; color: #aaa;
    pointer-events: none;
  }
  #cb-max { top: 50%; transform: translateY(calc(-100px - 8px)); }
  #cb-min { top: 50%; transform: translateY(calc(100px - 4px)); }
  #opacity-control { display: flex; align-items: center; gap: 6px; }
  #opacity-control input { width: 80px; }
</style>
</head>
<body>
<div id="container">
  <div id="controls">
    <label>Shape function:</label>
    <button class="active" data-node="0">N0 (0,0,0)</button>
    <button data-node="1">N1 (1,0,0)</button>
    <button data-node="2">N2 (0,1,0)</button>
    <button data-node="3">N3 (0,0,1)</button>
    <div id="opacity-control">
      <label for="opacity-slider">Opacity:</label>
      <input type="range" id="opacity-slider" min="0.1" max="1.0" step="0.05" value="0.75">
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <canvas id="colorbar"></canvas>
  <span id="cb-max">1.0</span>
  <span id="cb-min">0.0</span>
  <div id="info">Drag to rotate · Scroll to zoom</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Tet4 reference element ---
const nodes = [
  [0, 0, 0],  // node 0
  [1, 0, 0],  // node 1
  [0, 1, 0],  // node 2
  [0, 0, 1],  // node 3
];

// Shape functions: N0 = 1-x-y-z, N1 = x, N2 = y, N3 = z
function shapeFn(nodeIdx, x, y, z) {
  if (nodeIdx === 0) return 1 - x - y - z;
  if (nodeIdx === 1) return x;
  if (nodeIdx === 2) return y;
  return z;
}

// --- Viridis colormap (sampled) ---
const viridis = [
  [0.267, 0.004, 0.329],
  [0.283, 0.141, 0.458],
  [0.254, 0.265, 0.530],
  [0.207, 0.372, 0.553],
  [0.164, 0.471, 0.558],
  [0.128, 0.567, 0.551],
  [0.135, 0.659, 0.518],
  [0.267, 0.749, 0.441],
  [0.478, 0.821, 0.318],
  [0.741, 0.873, 0.150],
  [0.993, 0.906, 0.144],
];

function viridisColor(t) {
  t = Math.max(0, Math.min(1, t));
  const idx = t * (viridis.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.min(lo + 1, viridis.length - 1);
  const f = idx - lo;
  return new THREE.Color(
    viridis[lo][0] + f * (viridis[hi][0] - viridis[lo][0]),
    viridis[lo][1] + f * (viridis[hi][1] - viridis[lo][1]),
    viridis[lo][2] + f * (viridis[hi][2] - viridis[lo][2]),
  );
}

// --- Subdivide a triangle into smaller triangles ---
// Each face of the tet is a triangle defined by 3 vertex indices into `nodes`.
// We subdivide in barycentric coords to get a fine mesh for smooth coloring.
function subdivideTriangle(v0, v1, v2, subdivisions) {
  const verts = [];
  const indices = [];
  const n = subdivisions;

  for (let i = 0; i <= n; i++) {
    for (let j = 0; j <= n - i; j++) {
      const u = i / n;
      const v = j / n;
      const w = 1 - u - v;
      verts.push([
        w * v0[0] + u * v1[0] + v * v2[0],
        w * v0[1] + u * v1[1] + v * v2[1],
        w * v0[2] + u * v1[2] + v * v2[2],
      ]);
    }
  }

  // Build triangle indices
  let row = 0;
  for (let i = 0; i < n; i++) {
    const rowLen = n - i + 1;
    const nextRow = row + rowLen;
    for (let j = 0; j < rowLen - 1; j++) {
      indices.push(row + j, row + j + 1, nextRow + j);
      if (j < rowLen - 2) {
        indices.push(row + j + 1, nextRow + j + 1, nextRow + j);
      }
    }
    row = nextRow;
  }

  return { verts, indices };
}

// --- Build the tet faces ---
// 4 faces of the tetrahedron (outward-facing winding)
const faces = [
  [0, 2, 1],  // bottom (z=0)
  [0, 1, 3],  // front (y=0)
  [0, 3, 2],  // left (x=0)
  [1, 2, 3],  // hypotenuse
];

let activeNode = 0;
const subdivisions = 20;

function buildGeometry(nodeIdx) {
  const positions = [];
  const colors = [];
  const indexArray = [];
  let vertexOffset = 0;

  for (const face of faces) {
    const v0 = nodes[face[0]];
    const v1 = nodes[face[1]];
    const v2 = nodes[face[2]];
    const { verts, indices } = subdivideTriangle(v0, v1, v2, subdivisions);

    for (const p of verts) {
      positions.push(p[0], p[1], p[2]);
      const val = shapeFn(nodeIdx, p[0], p[1], p[2]);
      const c = viridisColor(val);
      colors.push(c.r, c.g, c.b);
    }

    for (const idx of indices) {
      indexArray.push(idx + vertexOffset);
    }
    vertexOffset += verts.length;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indexArray);
  geometry.computeVertexNormals();
  return geometry;
}

// --- Scene setup ---
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x1a1a2e);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
camera.position.set(1.8, 1.5, 1.8);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0.25, 0.25, 0.25);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(2, 3, 2);
scene.add(dirLight);

// Tet mesh (colored faces)
const material = new THREE.MeshLambertMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.75,
  depthWrite: false,
});

let mesh = new THREE.Mesh(buildGeometry(activeNode), material);
scene.add(mesh);

// Wireframe (edges of the tet)
const wireGeo = new THREE.BufferGeometry();
const edgeVerts = [];
const edges = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
for (const [a, b] of edges) {
  edgeVerts.push(...nodes[a], ...nodes[b]);
}
wireGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgeVerts, 3));
const wireMat = new THREE.LineBasicMaterial({ color: 0xaaaaaa });
const wireframe = new THREE.LineSegments(wireGeo, wireMat);
scene.add(wireframe);

// Node spheres
const sphereGeo = new THREE.SphereGeometry(0.02, 16, 16);
const nodeLabels = [];
for (let i = 0; i < 4; i++) {
  const color = i === activeNode ? 0xffffff : 0x888888;
  const mat = new THREE.MeshBasicMaterial({ color });
  const sphere = new THREE.Mesh(sphereGeo, mat);
  sphere.position.set(...nodes[i]);
  scene.add(sphere);
  nodeLabels.push({ sphere, mat });
}

// Axes helper
const axesLen = 0.3;
function makeAxis(dir, color) {
  const arrow = new THREE.ArrowHelper(
    new THREE.Vector3(...dir), new THREE.Vector3(0, 0, 0),
    axesLen, color, 0.04, 0.02
  );
  scene.add(arrow);
}
makeAxis([1, 0, 0], 0xff4444);
makeAxis([0, 1, 0], 0x44ff44);
makeAxis([0, 0, 1], 0x4444ff);

// --- Colorbar ---
function drawColorbar() {
  const cb = document.getElementById('colorbar');
  const ctx = cb.getContext('2d');
  const w = 20, h = 200;
  cb.width = w; cb.height = h;
  for (let y = 0; y < h; y++) {
    const t = 1 - y / (h - 1);
    const c = viridisColor(t);
    ctx.fillStyle = `rgb(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)})`;
    ctx.fillRect(0, y, w, 1);
  }
}
drawColorbar();

// --- Controls ---
function setActiveNode(idx) {
  activeNode = idx;
  scene.remove(mesh);
  mesh.geometry.dispose();
  mesh = new THREE.Mesh(buildGeometry(activeNode), material);
  scene.add(mesh);

  for (let i = 0; i < 4; i++) {
    nodeLabels[i].mat.color.setHex(i === activeNode ? 0xffffff : 0x888888);
  }

  document.querySelectorAll('#controls button[data-node]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.node) === idx);
  });
}

document.querySelectorAll('#controls button[data-node]').forEach(btn => {
  btn.addEventListener('click', () => setActiveNode(parseInt(btn.dataset.node)));
});

document.getElementById('opacity-slider').addEventListener('input', (e) => {
  material.opacity = parseFloat(e.target.value);
});

// --- Resize ---
function resize() {
  const rect = canvas.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// --- Animate ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
